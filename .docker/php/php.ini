; Custom PHP configuration, loaded after the default php.ini
; (copied to $PHP_INI_DIR/conf.d/ by php.Dockerfile).

[PHP]
memory_limit = 512M
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 25M
expose_php = Off
short_open_tag = Off

; Symfony recommendations: https://symfony.com/doc/current/performance.html
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[Date]
date.timezone = Europe/Paris

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Dev: check file timestamps so code changes are picked up without a restart.
; Set to 0 in production.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
