monolog:
    channels:
        - deprecation  # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50  # How many messages should be saved? Prevent memory leaks
            # Email alert on critical errors (uncaught exceptions, 500), with the request context
            # buffered before it. The mailer channel is excluded so a mailer failure cannot loop.
            alert:
                type: fingers_crossed
                action_level: critical
                handler: alert_deduplicated
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!mailer"]
                buffer_size: 50
            # Same error sent at most once an hour
            alert_deduplicated:
                type: deduplication
                handler: alert_mailer
                time: 3600
            alert_mailer:
                type: symfony_mailer
                from_email: 'contact@carolinenoyer.fr'
                to_email: '%app.contact_email%'
                subject: '[carolinenoyer.fr] Production error: %%message%%'
                level: debug
                formatter: monolog.formatter.html
                content_type: text/html
            mailer:
                type: stream
                path: "%kernel.logs_dir%/mailer.log"
                level: debug
                channels: ["mailer"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                formatter: monolog.formatter.json
