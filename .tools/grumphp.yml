grumphp:
    stop_on_failure: true
    process_timeout: 120

    git_hook_variables:
        EXEC_GRUMPHP_COMMAND: docker compose exec -T app php

    tasks:

        composer:
            no_check_publish: true

        phpcsfixer:
            config: .tools/.php-cs-fixer.php
            cache_file: .tools/.php-cs-fixer.cache
            allow_risky: true
            verbose: true
            diff: true

        phpstan:
            configuration: .tools/phpstan.neon
            memory_limit: "-1"
            use_grumphp_paths: false
            triggered_by: ['php']

        git_blacklist:
            regexp_type: "P"
            keywords:
                - '\bdd\('  # Trigger if "dd(" but NOT "->add(": "P"
                - 'dump\('
                - 'var_dump\('
                - 'die\('
                - 'exit;'
            triggered_by: [php, twig]

        phpunit:
            config_file: .tools/phpunit.xml
            always_execute: false
        
        shell:
            scripts:
                - '.tools/run-pre-commit.sh'
            metadata:
                priority: 100
