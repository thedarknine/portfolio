deptrac:
  paths:
    - ../src

  exclude_files:
    - '#.*test.*#'

  layers:
    - name: Controller
      collectors:
        - type: directory
          value: Controller/

    - name: Service
      collectors:
        - type: directory
          value: Service/

    - name: Repository
      collectors:
        - type: directory
          value: Repository/

    - name: Entity
      collectors:
        - type: directory
          value: Entity/

    - name: Enum
      collectors:
        - type: directory
          value: Enum/

    - name: Symfony
      collectors:
        - type: classNameRegex
          value: '#^Symfony\\.*#'

    - name: Doctrine
      collectors:
        - type: classNameRegex
          value: '#^Doctrine\\.*#'

    - name: EasyAdmin
      collectors:
        - type: classNameRegex
          value: '#^EasyCorp\\.*#'

    - name: Carbon
      collectors:
        - type: classNameRegex
          value: '#^Carbon\\.*#'

    - name: Gedmo
      collectors:
        - type: classNameRegex
          value: '#^Gedmo\\.*#'

    - name: Composer
      collectors:
        - type: classNameRegex
          value: '#^Composer\\.*#'

    - name: Kernel
      collectors:
        - type: classNameRegex
          value: '#^App\\Kernel$#'

    - name: Vendor
      collectors:
        - type: classNameRegex
          value: '#^(Symfony|Scheb|Doctrine)\\.*#'

  ruleset:
    Controller:
      - Service
      - Repository
      - Entity
      - Enum
      - Symfony
      - Doctrine
      - EasyAdmin
      - Vendor

    Service:
      - Repository
      - Entity
      - Enum
      - Symfony
      - Carbon
      - Composer
      - Kernel
      - Vendor

    Repository:
      - Entity
      - Doctrine
      - Symfony
      - Vendor

    Entity:
      - Repository
      - Enum
      - Symfony
      - Doctrine
      - Carbon
      - Gedmo
      - Vendor

    Kernel:
      - Symfony
      - Vendor

    Enum: ~
    Symfony: ~
    Doctrine: ~
    EasyAdmin: ~
