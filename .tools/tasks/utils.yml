# https://taskfile.dev
version: '3'

# Portfolio-only shortcuts

tasks:
    secret:
        desc: Generate a new APP_SECRET and display it
        vars:
            SECRET: { sh: openssl rand -hex 32 }
        cmds:
            - '{{.UI}} success "APP_SECRET generated - copy it to .env.local:" "{{.SECRET}}"'

    seo-audit:
        desc: Run the Lighthouse, Unlighthouse and pa11y audits (target=dev|prod)
        cmds:
            - '{{.UI}} title "🔍 Running the SEO and accessibility audit ({{.target | default "dev"}})"'
            - 'bash {{.TOOLS_DIR}}/scripts/audit.sh {{.target | default "dev"}}'

    prune:
        desc: Prune the pnpm store and list the unused packages, files and exports with knip
        cmds:
            - '{{.UI}} subtitle "🧹 Pruning the pnpm store"'
            - '{{.EXEC}} pnpm store prune'
            # Importmap packages and the dev tools called from the Taskfile are ignored in knip.json
            - '{{.UI}} subtitle "🔍 Looking for unused packages, files and exports"'
            - >-
              {{.EXEC}} pnpm exec knip --config {{.CONFIG_DIR}}/knip.json
              || { {{.UI}} error "knip found unused or missing packages, files or exports."; exit 1; }
            - '{{.UI}} success "pnpm store pruned, nothing unused."'
