# Runs the same tasks as locally: GitHub-hosted runners have Docker, so the job builds the
# image, starts the stack with "task up" and runs "task qa" in the app container.
# Mutation and UI tests are left out (slow): run them locally with "task qa deep=1".
name: CI

on:  # yamllint disable-line rule:truthy
    pull_request:
    push:
        branches: [main, develop]

# A new push on the same branch or pull request cancels the previous run
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    qa:
        name: QA - cs, lint, quality, tests, arch
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            # Adds the CI override with the image layer cache (takes precedence over .env)
            COMPOSE_FILE: docker-compose.yaml:docker-compose.dev.yaml:docker-compose.ci.yaml
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # Full history: gitleaks scans every commit (lint:secrets)
                  fetch-depth: 0

            # BuildKit builder able to read and write the GitHub Actions cache
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # Exposes the cache URL and token to "docker compose build" (only available to actions otherwise)
            - name: Expose the GitHub Actions runtime
              uses: crazy-max/ghaction-github-runtime@v4

            - name: Install Task
              uses: go-task/setup-task@v2
              with:
                  version: 3.x

            # The checkout belongs to the runner user: the app container must use the same ids
            - name: Use the runner user in the app container
              run: |
                  echo "HOST_UID=$(id -u)" >> "$GITHUB_ENV"
                  echo "HOST_GID=$(id -g)" >> "$GITHUB_ENV"

            - name: Start the containers
              run: task up

            - name: Install dependencies
              run: task symfony:install

            # Portfolio-only: the test fixtures are generated from the dev database (composer pipeline:fixtures),
            # so it needs the schema and the committed fixtures first.
            # Migrations rather than the entities: checks that they replay on an empty database,
            # then that they match the entities (a forgotten migration fails here)
            - name: Set up the dev database
              run: |
                  task db:create
                  task db:migrate
                  task symfony:console -- doctrine:schema:validate
                  task --yes db:fixtures

            - name: Run the QA suite
              run: task qa

            # Only for what goes to production: pull requests to main and pushes on main
            - name: Check the production build
              if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
              run: task symfony:build-prod

            - name: Show the container logs
              if: failure()
              run: docker compose logs

    commitlint:
        name: Conventional commits
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Install Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: lts/*
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check the commit messages of the pull request
              run: >-
                  pnpm exec commitlint --config .tools/config/commitlint.config.cjs
                  --from ${{ github.event.pull_request.base.sha }}
                  --to ${{ github.event.pull_request.head.sha }}
                  --verbose
